<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>Autoneural | Enterprise AI Solutions, AI Agents & Business Automation</title>
    <meta name="description" content="Autoneural builds world-class enterprise AI solutions — custom AI agents, intelligent automation, and digital platforms that help businesses streamline operations and accelerate growth. Book a free consultation today." />
    <meta name="keywords" content="enterprise AI solutions, AI agents, business automation, custom AI software, AI consulting, machine learning, intelligent automation, AI development company, enterprise software, AI platform" />
    <meta name="author" content="Autoneural" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://autoneural.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Autoneural" />
    <meta property="og:url" content="https://autoneural.com/" />
    <meta property="og:title" content="Autoneural | Enterprise AI Solutions, AI Agents & Business Automation" />
    <meta property="og:description" content="Autoneural builds world-class enterprise AI solutions — custom AI agents, intelligent automation, and digital platforms that help businesses streamline operations and accelerate growth." />
    <meta property="og:image" content="https://autoneural.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@autoneural" />
    <meta name="twitter:creator" content="@autoneural" />
    <meta name="twitter:title" content="Autoneural | Enterprise AI Solutions, AI Agents & Business Automation" />
    <meta name="twitter:description" content="Autoneural builds world-class enterprise AI solutions — custom AI agents, intelligent automation, and digital platforms that help businesses streamline operations." />
    <meta name="twitter:image" content="https://autoneural.com/og-image.jpg" />

    <!-- Theme & App -->
    <meta name="theme-color" content="#3558E6" />
    <meta name="msapplication-TileColor" content="#3558E6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Autoneural",
      "url": "https://autoneural.com",
      "logo": "https://autoneural.com/favicon.svg",
      "description": "Autoneural builds world-class enterprise AI solutions including custom AI agents, intelligent automation, and digital platforms.",
      "foundingDate": "2024",
      "sameAs": [
        "https://www.linkedin.com/company/autoneural",
        "https://twitter.com/autoneural"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "availableLanguage": "English"
      },
      "offers": {
        "@type": "Offer",
        "description": "Enterprise AI consulting, AI agent development, business process automation, and custom enterprise software."
      }
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Autoneural",
      "url": "https://autoneural.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://autoneural.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: ProfessionalService -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Autoneural",
      "url": "https://autoneural.com",
      "image": "https://autoneural.com/og-image.jpg",
      "description": "Enterprise AI solutions company specialising in AI agents, automation, and intelligent software for businesses.",
      "priceRange": "££££",
      "areaServed": "Worldwide",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "AI Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Consulting" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Agent Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Process Automation" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Enterprise Software Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Machine Learning & Predictive Analytics" } }
        ]
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
